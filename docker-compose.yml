services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: sharing }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@db:5432/sharing
      SECRET_KEY: ${SECRET_KEY:-change-me}
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata: {}
